services:

  spark-master:
    image: apache/spark:3.5.9-scala2.12-java17-python3-r-ubuntu
    container_name: spark-master
    hostname: spark-master

    command:
      [
        "/opt/spark/bin/spark-class",
        "org.apache.spark.deploy.master.Master",
        "--host",
        "spark-master",
        "--port",
        "7077",
        "--webui-port",
        "8080"
      ]

    ports:
      - "7077:7077"
      - "8090:8080"

    environment:
      PYTHONPATH: /opt/spark/apps

    volumes:
      - ./src:/opt/spark/apps
      - ./data:/opt/spark/data

    networks:
      - data-network


  spark-worker-1:
    image: apache/spark:3.5.9-scala2.12-java17-python3-r-ubuntu
    container_name: spark-worker-1
    hostname: spark-worker-1

    command:
      [
        "/opt/spark/bin/spark-class",
        "org.apache.spark.deploy.worker.Worker",
        "spark://spark-master:7077",
        "--cores",
        "2",
        "--memory",
        "2g",
        "--webui-port",
        "8081"
      ]

    depends_on:
      - spark-master

    ports:
      - "8091:8081"

    environment:
      PYTHONPATH: /opt/spark/apps

    volumes:
      - ./src:/opt/spark/apps
      - ./data:/opt/spark/data

    networks:
      - data-network


  spark-worker-2:
    image: apache/spark:3.5.9-scala2.12-java17-python3-r-ubuntu
    container_name: spark-worker-2
    hostname: spark-worker-2

    command:
      [
        "/opt/spark/bin/spark-class",
        "org.apache.spark.deploy.worker.Worker",
        "spark://spark-master:7077",
        "--cores",
        "2",
        "--memory",
        "2g",
        "--webui-port",
        "8081"
      ]

    depends_on:
      - spark-master

    ports:
      - "8092:8081"

    environment:
      PYTHONPATH: /opt/spark/apps

    volumes:
      - ./src:/opt/spark/apps
      - ./data:/opt/spark/data

    networks:
      - data-network


networks:
  data-network:
    name: open-retail-net